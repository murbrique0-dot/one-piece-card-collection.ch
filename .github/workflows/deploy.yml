name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.S | re.I)
          js_scripts = [
              (attrs, script) for attrs, script in scripts
              if not re.search(r'type\s*=\s*["\']application/ld\+json["\']', attrs, flags=re.I)
          ]
          if not js_scripts:
              raise SystemExit('No inline JavaScript found')
          for number, (attrs, script) in enumerate(js_scripts, 1):
              if re.search(r'type\\s*=\\s*["\\']module["\\']', attrs, flags=re.I):
                  subprocess.run(['node', '--input-type=module', '--check'], input=script, text=True, check=True)
              else:
                  path = Path(f'/tmp/site-script-{number}.js')
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'Validated {len(js_scripts)} inline JavaScript block(s).')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
